<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RakshaNet | Admin Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">🛡️</span>
        <span>
            Raksha<span class="logo-highlight">Net</span>
        </span>
    </div>

    <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="map.html">Live Map</a>
        <a href="help.html">Emergency Help</a>
    </nav>

</header>


<main>

    <section
        style="
            min-height: calc(100vh - 180px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
        "
    >

        <div
            class="emergency-form-card"
            style="
                width:100%;
                max-width:520px;
            "
        >

            <div class="emergency-header">

                <span class="emergency-label">
                    🔐 ADMINISTRATOR ACCESS
                </span>

                <h1>
                    RakshaNet Admin Login
                </h1>

                <p>
                    Secure access to disaster reports,
                    SOS alerts, volunteers and
                    response management.
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="form-section">

                    <label for="adminIdentifier">
                        Mobile number or Email
                    </label>

                    <input
                        class="rn-input"
                        id="adminIdentifier"
                        type="text"
                        placeholder="Enter your admin mobile or email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-section">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        class="rn-input"
                        id="adminPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="adminLoginMessage"
                    class="rn-alert-banner"
                    style="display:none;"
                ></div>


                <button
                    type="submit"
                    class="submit-emergency-btn"
                    id="adminLoginButton"
                >
                    🔐 LOGIN AS ADMIN
                </button>

            </form>

        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        🛡️ RakshaNet
    </div>

    <p>
        Intelligent Disaster Management & Emergency Response
    </p>

</footer>


<script src="../js/admin.js"></script>

</body>

</html>
